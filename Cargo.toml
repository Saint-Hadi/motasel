[package]
name = "motasel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A simple, secure local-network file sharing web application."

[profile.release]
lto = true
codegen-units = 1

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "macros", "signal", "process"] }

# HTTP server
axum = { version = "0.8", features = ["json", "multipart"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Adapt a multipart field's byte stream into an AsyncRead for disk streaming
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# Serialization / metadata
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique internal file IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# RFC 6266 filename encoding in Content-Disposition
percent-encoding = "2.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
